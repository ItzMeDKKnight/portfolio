<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <!-- Placeholder cover: blade slash through fruit -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0f1f"/>
      <stop offset="0.6" stop-color="#0c0a12"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <!-- watermelon halves -->
  <g transform="translate(860 330) rotate(-20)">
    <g transform="translate(-14 -10)">
      <path d="M-150 0 A150 150 0 0 1 150 0Z" fill="#16a34a"/>
      <path d="M-134 0 A134 134 0 0 1 134 0Z" fill="#f43f5e"/>
      <g fill="#1f1115"><ellipse cx="-60" cy="-50" rx="6" ry="10"/><ellipse cx="0" cy="-80" rx="6" ry="10"/><ellipse cx="60" cy="-50" rx="6" ry="10"/><ellipse cx="-20" cy="-30" rx="6" ry="10"/><ellipse cx="34" cy="-24" rx="6" ry="10"/></g>
    </g>
    <g transform="translate(14 22)">
      <path d="M-150 0 A150 150 0 0 0 150 0Z" fill="#16a34a"/>
      <path d="M-134 0 A134 134 0 0 0 134 0Z" fill="#fb7185"/>
      <g fill="#1f1115"><ellipse cx="-50" cy="44" rx="6" ry="10"/><ellipse cx="10" cy="74" rx="6" ry="10"/><ellipse cx="66" cy="40" rx="6" ry="10"/></g>
    </g>
  </g>
  <circle cx="1060" cy="580" r="52" fill="#f59e0b"/>
  <circle cx="1060" cy="580" r="52" fill="none" stroke="#fde68a" stroke-opacity="0.4" stroke-width="6"/>
  <circle cx="660" cy="150" r="36" fill="#a3e635"/>
  <!-- blade trail -->
  <path d="M600 640 Q 860 360 1150 90" fill="none" stroke="url(#blade)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
  <!-- fingertip -->
  <circle cx="1150" cy="90" r="14" fill="#fff" filter="url(#glow)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="290" font-size="92" font-weight="700" fill="#fff">Fruit <tspan fill="#fb7185">Ninja</tspan></text>
    <text x="84" y="346" font-size="26" fill="#fda4af" letter-spacing="6">YOUR FINGER IS THE BLADE</text>
    <g font-size="20" fill="#b7a8b8" letter-spacing="1">
      <text x="84" y="430">OpenCV · MediaPipe hand tracking · Pygame</text>
    </g>
    <rect x="84" y="464" width="64" height="9" rx="4.5" fill="#fb7185"/>
  </g>
</svg>
